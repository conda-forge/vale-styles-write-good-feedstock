# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.4.0"
  vale_name: write-good
  summary: write-good rules for vale grammar and style checker
  # well-known
  styles: share/vale/styles
  # os
  export: ${{ "export" if unix else "set" }}
  mkdir_p: ${{ "mkdir -p" if unix else "md" }}
  slash: ${{ "/" if unix else "\\" }}
  cp_r: ${{ "cp -r" if unix else "copy" }}
  os_styles: ${{ slash }}${{ styles | split("/") | join(slash) }}${{ slash }}

package:
  name: vale-styles-write-good
  version: ${{ version }}

source:
  - url: https://github.com/errata-ai/${{ vale_name }}/releases/download/v${{ version }}/${{ vale_name }}.zip
    sha256: e0e86123266f7b82378e84a6183bb55d98c9b61528bcb734d17472ebc22cd415
    target_directory: ${{ vale_name }}
  - url: https://raw.githubusercontent.com/vale-cli/${{ vale_name }}/refs/tags/v${{ version }}/LICENSE
    sha256: b9bb0975e308708b97e4a30c7665c815fe4bd3a1de2ed04d35c0eef03d4eaa69
    target_directory: ${{ vale_name }}

build:
  number: 0
  noarch: generic
  script:
    - ${{ mkdir_p }} "${{ PREFIX }}${{ os_styles }}"
    - ${{ cp_r }} "${{ vale_name }}" "${{ PREFIX }}${{ os_styles }}${{ slash }}${{ vale_name }}"

requirements:
  run:
    - vale

tests:
  - package_contents:
      strict: true
      files:
        - ${{ styles }}/${{ vale_name }}/*.yml
        - ${{ styles }}/${{ vale_name }}/{LICENSE,README.md}
        - ${{ styles }}/${{ vale_name }}/meta.json
  - requirements:
      run:
        - pytest
    script:
      env:
        VALE_PKG_NAME: ${{ vale_name }}
      file: run_test.py

about:
  license: MIT
  license_file: ${{ vale_name }}/LICENSE
  summary: ${{ summary }}
  homepage: https://github.com/errata-ai/${{ vale_name }}

extra:
  recipe-maintainers:
    - bollwyvl
